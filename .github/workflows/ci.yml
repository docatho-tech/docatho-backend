name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  # PAUSED — automatic triggers disabled while the pre-existing ruff lint debt
  # (~377 violations on master) is cleared. Uncomment both blocks to resume.
  # pull_request:
  #   branches: ['master']
  #   paths-ignore: ['docs/**']
  #
  # push:
  #   branches: ['master']
  #   paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

    env:
      # settings read individual POSTGRES_* vars (see config/settings/base.py)
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: "true"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Check DB Migrations
        run: uv run python manage.py makemigrations --check

      - name: Run DB Migrations
        run: uv run python manage.py migrate

      - name: Test with pytest
        run: uv run pytest
