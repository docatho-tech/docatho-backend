name: Deploy

# Deploys to the EC2 host on every push to master, and on demand via the
# Actions tab (workflow_dispatch).
#
# There is no CI gate: the CI workflow is paused behind the ruff lint debt, so
# gating on it would mean nothing ever deploys. Restore the workflow_run
# trigger below — and drop the push trigger — once CI is green again.
#
#   workflow_run:
#     workflows: ["CI"]
#     types: [completed]
#     branches: [master]
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run deploy script
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            bash /opt/docatho/docatho-backend/deploy/deploy.sh
