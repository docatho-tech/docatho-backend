name: Env check

# Temporary diagnostic: reports which payment-related variable NAMES are
# present on the prod host and in which file. Values are never printed, only
# their length. Delete once the question it was added to answer is settled.
on:
  workflow_dispatch:

jobs:
  env-check:
    name: Report env var names over SSH
    runs-on: ubuntu-latest
    steps:
      - name: SSH and report
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "whoami: $(whoami)"
            for f in /etc/docatho/docatho.env /opt/docatho/docatho-backend/.env; do
              echo "=== $f ==="
              if [ -r "$f" ]; then
                # Names and value lengths only — never the value itself.
                grep -E '^[A-Z_]*(RZP|RAZORPAY|DJANGO_READ_DOT_ENV|DJANGO_SETTINGS)[A-Z_]*=' "$f" \
                  | while IFS='=' read -r name value; do
                      echo "  $name = <${#value} chars>"
                    done
                echo "  (total lines: $(wc -l < "$f"))"
              else
                echo "  not readable by $(whoami)"
              fi
            done
