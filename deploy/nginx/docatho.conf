# nginx reverse proxy for the docatho backend.
# Static & media are served from S3 (django-storages), so nginx only proxies
# the app. Copy to /etc/nginx/sites-available/docatho and symlink into
# sites-enabled, then run `certbot --nginx -d api.example.com` to add TLS
# (certbot rewrites this file to add the :443 server + 80->443 redirect).

upstream docatho_app {
    server unix:/run/docatho/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name api.example.com;   # <-- change to your API domain

    # Allow prescription / product image uploads.
    client_max_body_size 20M;

    # Let's Encrypt HTTP-01 challenge (certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://docatho_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django's SECURE_PROXY_SSL_HEADER expects this; certbot's :443 block
        # will pass "https" here after TLS is provisioned.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
