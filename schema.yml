components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        address_line1:
          type: string
          maxLength: 255
        address_line2:
          type: string
          nullable: true
          maxLength: 255
        landmark:
          type: string
          nullable: true
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        is_default:
          type: boolean
        user:
          type: integer
          readOnly: true
      required:
      - address_line1
      - city
      - country
      - id
      - postal_code
      - state
      - user
    AdminOrder:
      type: object
      description: Adds fulfilment/money fields visible only to staff & providers.
      properties:
        id:
          type: integer
          readOnly: true
        order_number:
          type: string
          maxLength: 64
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        user_phone:
          type: string
          readOnly: true
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
          readOnly: true
        assigned_provider:
          type: integer
          nullable: true
        provider_name:
