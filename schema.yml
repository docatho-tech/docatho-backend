  /api/auth-token/:
    post:
      operationId: auth_token_create
      tags:
      - auth-token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/cart/:
    get:
      operationId: cart_retrieve
      description: |-
        Simple Cart API:
        - GET    /api/cart/            -> current open cart
        - POST   /api/cart/add/        -> add item {medicine_id, quantity}
        - PATCH  /api/cart/update/     -> update item quantity {medicine_id, quantity}
        - POST   /api/cart/remove/     -> remove item {medicine_id}
      tags:
      - cart
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/cart/{id}/:
    get:
      operationId: cart_retrieve_2
