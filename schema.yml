        description: A unique integer value identifying this order.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrder'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/admin/orders/{id}/update-status/:
    patch:
      operationId: admin_orders_update_status_partial_update
      description: 'Admin: list/retrieve all orders, update status, assign providers.'
      parameters:
      - in: path
