          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrder'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/analytics/payouts/:
    get:
      operationId: analytics_payouts_retrieve
      description: |-
        GET /api/analytics/payouts/ — provider payout summary (EP-07/EP-11).

        Admins see all providers; a provider sees only their own totals.
      tags:
      - analytics
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/analytics/revenue/:
    get:
