openapi: 3.0.3
info:
  title: docatho_backend API
  version: 1.0.0
  description: Documentation of API endpoints of docatho_backend
paths:
  /api/{id}/detail/:
    get:
      operationId: detail_retrieve
      description: |-
        GET /api/users/<pk>/detail/ - get detailed user information
        Returns user info, address, and all orders with complete order details.
        Requires authentication. Users can view their own details, admins can view any user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - detail
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/addresses/:
    get:
      operationId: addresses_retrieve
      description: |-
        Address collection for the current user.

        * GET  /api/addresses/ - list the user's addresses (default first)
        * POST /api/addresses/ - create an address for the user

        The model's ``save()`` guarantees a single default per user, so no manual
        default-unsetting is needed here.
      tags:
      - addresses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: addresses_create
      description: |-
        Address collection for the current user.

        * GET  /api/addresses/ - list the user's addresses (default first)
        * POST /api/addresses/ - create an address for the user

        The model's ``save()`` guarantees a single default per user, so no manual
        default-unsetting is needed here.
      tags:
      - addresses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/addresses/{id}/:
    get:
      operationId: addresses_retrieve_2
      description: |-
        Single address owned by the current user.

        * GET    /api/addresses/<pk>/ - retrieve
        * PATCH  /api/addresses/<pk>/ - partial update (incl. set is_default)
        * DELETE /api/addresses/<pk>/ - delete
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: addresses_partial_update
      description: |-
        Single address owned by the current user.

        * GET    /api/addresses/<pk>/ - retrieve
        * PATCH  /api/addresses/<pk>/ - partial update (incl. set is_default)
        * DELETE /api/addresses/<pk>/ - delete
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: addresses_destroy
      description: |-
        Single address owned by the current user.

        * GET    /api/addresses/<pk>/ - retrieve
        * PATCH  /api/addresses/<pk>/ - partial update (incl. set is_default)
        * DELETE /api/addresses/<pk>/ - delete
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin-login/:
    post:
      operationId: admin_login_create
      tags:
      - admin-login
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/admin/orders/:
    get:
      operationId: admin_orders_list
      description: 'Admin: list/retrieve all orders, update status, assign providers.'
      parameters:
      - in: query
        name: assigned_provider
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - cod
          - online
        description: |-
          * `online` - Online (Razorpay)
          * `cod` - Cash on delivery
      - in: query
        name: payment_status
        schema:
          type: string
          enum:
          - failed
          - paid
          - pending
          - refunded
        description: |-
          * `pending` - Pending
          * `paid` - Paid
          * `failed` - Failed
          * `refunded` - Refunded
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - cancelled
          - confirmed
          - delivered
          - out_for_delivery
          - packed
          - placed
          - processing
          - rejected
          - returned
        description: |-
          * `placed` - Placed
          * `approved` - Approved
          * `rejected` - Rejected
          * `packed` - Packed
          * `confirmed` - Confirmed
          * `processing` - Processing
          * `out_for_delivery` - Out for delivery
          * `delivered` - Delivered
          * `cancelled` - Cancelled
          * `returned` - Returned
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderList'
          description: ''
  /api/admin/orders/{id}/:
    get:
      operationId: admin_orders_retrieve
      description: 'Admin: list/retrieve all orders, update status, assign providers.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
          description: ''
  /api/admin/orders/{id}/assign-provider/:
    patch:
      operationId: admin_orders_assign_provider_partial_update
      description: 'Admin: list/retrieve all orders, update status, assign providers.'
      parameters:
